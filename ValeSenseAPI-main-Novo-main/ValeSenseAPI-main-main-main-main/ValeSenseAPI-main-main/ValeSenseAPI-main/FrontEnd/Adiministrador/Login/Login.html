<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValeSense | Acesso do administrador</title>
  <link rel="stylesheet" href="Login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <img class="brand-mark" src="../assets/Logo.svg" alt="ValeSense">
      <p class="eyebrow">Área exclusiva</p>
      <h1 id="login-title">Administrador</h1>
      <p class="intro">Entre com sua conta administrativa para acessar o painel.</p>
      <form id="adminLoginForm">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="loginError" class="error" role="alert" aria-live="polite"></p>
        <button id="submitButton" type="submit">Entrar</button>
      </form>
    </section>
  </main>
  <script src="../../api-config.js"></script>
  <script src="../../api-client.js"></script>
  <script src="Login.js"></script>
</body>
</html>
