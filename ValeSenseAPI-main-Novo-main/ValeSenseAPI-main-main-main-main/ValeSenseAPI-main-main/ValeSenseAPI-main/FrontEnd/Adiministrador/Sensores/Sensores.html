<!DOCTYPE html>

<head>

<body data-login-path="../Login/Login.html">
  <div class="topbar">
    <div class="brand">
      <img class="brand-logo" src="../assets/Logo.svg" alt="ValeSense">
      ValeSense
    </div><span class="role-label">&#193;rea do administrador</span>
    <div class="topbar-actions">
      <a class="icon-btn" href="../Configurações/Configuracoes.html" aria-label="Configurações" title="Configurações">
        <img class="action-icon" src="../assets/Config.svg" alt="">
      </a>
      <button class="icon-btn" id="scrollTopBtn" aria-label="Voltar ao topo" title="Voltar ao topo">
        <img class="action-icon" src="../assets/Seta.svg" alt="">
      </button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Alternar modo escuro" title="Ativar modo escuro" aria-pressed="false">
        <img data-theme-icon src="../assets/Lua.svg" alt="">

    <button class="icon-btn logout-action" type="button" data-logout aria-label="Sair" title="Sair"><img class="logout-icon" src="../assets/Sair.svg" alt=""><span>Sair</span></button></div>

  <div class="layout">

          Sensores

        <p class="section-subtitle">Consulte os sensores cadastrados e altere seu status.</p>

        <div class="card">
          <h2 class="section-title">Sensores cadastrados</h2>
          <div id="sensorList" class="sensor-list">
            <p>Carregando sensores...</p>
          </div>
          <button id="addSensorBtn" class="btn-add-sensor">
            <img src="../assets/Lapis.svg" alt="" aria-hidden="true">

  <script src="../../theme.js"></script>
