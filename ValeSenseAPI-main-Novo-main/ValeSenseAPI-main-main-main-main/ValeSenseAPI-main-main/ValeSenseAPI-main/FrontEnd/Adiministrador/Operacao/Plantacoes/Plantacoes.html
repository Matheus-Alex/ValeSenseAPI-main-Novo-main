<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ValeSense | Minhas plantações</title>
    <script>
      document.documentElement.classList.toggle(
        "dark-theme",
        localStorage.getItem("valesense_theme") === "dark",
      );
    </script>
    <link rel="stylesheet" href="Plantacoes.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../role-visual.css">
  <link rel="stylesheet" href="../../admin-sidebar.css">
</head>
  <body data-login-path="../../Login/Login.html">
    <header class="pe-topbar">
      <a class="pe-brand" href="../Home/Home.html"
        ><img
          src="../../assets/Logo.svg"
          alt=""
        />ValeSense</a
      ><span class="pe-profile-label">Área do administrador</span>
      <div class="pe-top-actions">
        <button
          class="pe-icon-button"
          type="button"
          data-scroll-top
          aria-label="Voltar ao topo"
          title="Voltar ao topo"
        >
          <img
            src="../../assets/Seta.svg"
            alt=""
          /></button
        ><a
          class="pe-icon-button"
          href="../../Configurações/Configuracoes.html"
          aria-label="Configurações"
          title="Configurações"
          ><img
            src="../../assets/Config.svg"
            alt="" /></a
        ><button
          class="pe-icon-button"
          type="button"
          data-theme-toggle
          aria-label="Alternar tema"
          title="Alternar tema"
          aria-pressed="false"
        >
          <img
            data-theme-icon
            src="../../assets/Lua.svg"
            alt=""
          /></button
        ><button
          class="pe-icon-button logout-action"
          type="button"
          data-logout
          aria-label="Sair"
          title="Sair"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M10 17l5-5-5-5M15 12H3" />
            <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" /></svg
          ><span>Sair</span>
        </button>
      </div>
    </header>
    <div class="pe-layout">
      <aside class="pe-sidebar">
        <nav class="pe-nav" aria-label="Navegação principal">
          <a class="pe-nav-link" href="../Home/Home.html"
            ><img
              src="../../assets/Home.svg"
              alt=""
            />Início</a
          ><a
            class="pe-nav-link active"
            href="Plantacoes.html"
            aria-current="page"
            ><img
              src="../../assets/Maps.svg"
              alt=""
            />Plantações</a
          ><a class="pe-nav-link" href="../Colheita/Colheita.html"
            ><img
              src="../../assets/Lupa.svg"
              alt=""
            />Safra</a
          ><a class="pe-nav-link" href="../Mercado/Mercado.html"
            ><img
              src="../../assets/Dashboard.svg"
              alt=""
            />Mercado</a
          ><a class="pe-nav-link" href="../Alertas/Alertas.html"
            ><img
              src="../../assets/Alerta.svg"
              alt=""
            />Alertas</a
          ><a class="pe-nav-link" href="../../Configurações/Configuracoes.html"
            ><img
              src="../../assets/Config.svg"
              alt=""
            />Configurações</a
          >
        </nav>
      </aside>
      <main class="pe-content">
        <div class="pe-heading">
          <div>
            <h1>Minhas plantações</h1>
            <p class="pe-kicker">Talhões vinculados à sua conta</p>
            <p>Área e condição dos sensores por talhão cadastrado.</p>
          </div>
          <label class="pe-toolbar"
            ><span class="pe-stat-label">Pesquisar</span
            ><input
              class="pe-input"
              id="plotSearch"
              type="search"
              placeholder="Nome do talhão ou propriedade"
              aria-label="Pesquisar talhões"
          /></label>
        </div>
        <section class="pe-grid pe-grid-3" id="plotGrid" aria-live="polite">
          <p class="pe-loading">Carregando talhões...</p>
        </section>
      </main>
    </div>
    <script src="../../../theme.js"></script>
    <script src="../../../api-config.js"></script>
    <script src="../../../api-client.js"></script>
    <script src="../../auth-guard.js"></script>
    <script src="../shared.js"></script>
    <script src="Plantacoes.js"></script>
    <script src="../../admin-sidebar.js"></script>
</body>
</html>
